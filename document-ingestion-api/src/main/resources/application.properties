## allow network connection
quarkus.http.host=0.0.0.0

## datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=xxx
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5436/document-ingestion-db

## flyway
quarkus.flyway.migrate-at-start=true

## ollama
ollama.base-url=http://100.87.153.22:11434

ollama.embedding-model-name=bge-m3

#ollama.model-name=gemma4:e4b
#ollama.num-ctx=32768

ollama.model-name=gemma4:e2b
ollama.num-ctx=65536

ollama.timeout-seconds=300

## toc isolation (ollama cloud)
# https://ollama.com | http://100.87.153.22:11434
ollama.toc-isolation.base-url=https://ollama.com
ollama.toc-isolation.api-key=${OLLAMA_API_KEY:}
ollama.toc-isolation.model-name=gemma4:31b
